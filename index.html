<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="ツール">
<link rel="apple-touch-icon" id="touch-icon" href="icons/grid-blue-180.png">
<link rel="icon" id="fav-icon" href="icons/grid-blue-180.png">
<link rel="manifest" id="manifest-link" href="manifest.webmanifest">
<script>
// 選んだホーム画面アイコンを、ページを読み込んだ直後に反映する
(function () {
  var id = 'grid-blue';
  try { id = localStorage.getItem('tools-hub:icon') || id; } catch (e) {}
  window.__hubIcon = id;
})();
</script>
<title>ツール</title>
<script src="shared/backup.js"></script>
<style>
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --bar: rgba(249, 249, 249, 0.94);
  --label: #000000;
  --sub: #6C6C70;
  --sep: rgba(60, 60, 67, 0.15);
  --accent: #007AFF;
  --active-bg: rgba(0, 122, 255, 0.12);
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", Roboto, sans-serif;
  --tab-h: 56px;
  --side-w: 232px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1C1C1E;
    --bar: rgba(22, 22, 24, 0.94);
    --label: #FFFFFF;
    --sub: #98989F;
    --sep: rgba(84, 84, 88, 0.6);
    --accent: #0A84FF;
    --active-bg: rgba(10, 132, 255, 0.2);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--label);
  font-family: var(--font);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

.icon {
  flex: none; width: 28px; height: 28px; border-radius: 7px;
  display: grid; place-items: center; font-size: 17px; overflow: hidden;
  background: var(--bg);
}
.icon img { width: 100%; height: 100%; object-fit: cover; }

/* ---- 画面本体 ---- */
#stage {
  position: fixed;
  top: 0; left: 0; right: 0;
  bottom: calc(var(--tab-h) + env(safe-area-inset-bottom));
}
#stage iframe {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border: 0; background: var(--bg);
}
#stage iframe[hidden] { display: none; }

/* ---- スマホ：下部タブバー ---- */
#tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  height: calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: flex;
  background: var(--bar);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  border-top: 0.5px solid var(--sep);
}
#tabbar button {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 10px; color: var(--sub);
}
#tabbar button .icon { width: 26px; height: 26px; background: transparent; }
#tabbar button span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
#tabbar button[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* ツールが自前の下部タブバーを持つときは、ハブの下部バーを隠して2段にしない */
body.own-bar #tabbar { display: none; }
body.own-bar #stage { bottom: 0; }

/* ---- 「すべて」シート ---- */
#sheet-backdrop {
  position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.35);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  max-height: 80vh; overflow-y: auto;
  background: var(--bg);
  border-radius: 14px 14px 0 0;
  padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform .25s ease;
}
body.sheet-open #sheet-backdrop { opacity: 1; pointer-events: auto; }
body.sheet-open #sheet { transform: none; }
#sheet .grip { width: 36px; height: 5px; border-radius: 3px; background: var(--sep); margin: 4px auto 12px; }
#sheet h2 { font-size: 13px; font-weight: 400; color: var(--sub); margin: 14px 8px 6px; }
#sheet .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
#sheet .grid button {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 10px 4px; border-radius: 12px; background: var(--card); font-size: 12px; text-align: center;
}
#sheet .grid button .icon { width: 40px; height: 40px; border-radius: 9px; font-size: 22px; }
#sheet .grid button[aria-current="page"] { outline: 2px solid var(--accent); }
#sheet .hint { font-size: 12px; color: var(--sub); margin: 16px 8px 0; }
.icon-open { display: block; margin: 16px 8px 0; color: var(--accent); font-size: 15px; }

/* ---- ホーム画面アイコンの選択 ---- */
#icon-dialog, #backup-dialog { border: none; border-radius: 14px; padding: 0; width: min(420px, calc(100% - 32px)); background: var(--bg); color: var(--label); }
#backup-dialog::backdrop, #icon-dialog::backdrop { background: rgba(0,0,0,0.35); }
#backup-dialog header, #icon-dialog header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
#backup-dialog h2, #icon-dialog h2 { font-size: 17px; margin: 0; }
#backup-dialog .done, #icon-dialog .done { color: var(--accent); font-size: 17px; font-weight: 600; }
#backup-dialog .note, #icon-dialog .note { font-size: 13px; color: var(--sub); margin: 0 16px 12px; }
.backup-actions { display: flex; flex-direction: column; gap: 8px; padding: 0 16px 16px; }
.backup-actions button { padding: 12px; border-radius: 10px; background: var(--card); font-size: 16px; color: var(--accent); }
.backup-actions button:disabled { opacity: .5; }
#backup-status { font-size: 13px; color: var(--sub); margin: 0 16px 16px; min-height: 1em; }
#backup-status:empty { display: none; }
.icon-choices { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; padding: 0 16px 18px; }
.icon-choices button { aspect-ratio: 1; border-radius: 22%; overflow: hidden; outline-offset: 3px; }
.icon-choices button img { width: 100%; height: 100%; display: block; }
.icon-choices button[aria-pressed="true"] { outline: 3px solid var(--accent); }
.icon-choices button:not([aria-pressed="true"]) img { box-shadow: inset 0 0 0 0.5px var(--sep); }

/* ---- パソコン・タブレット：サイドバー ---- */
#sidebar { display: none; }
@media (min-width: 768px) {
  #tabbar, #sheet, #sheet-backdrop { display: none; }
  #stage { left: var(--side-w); bottom: 0; }
  #sidebar {
    display: flex; flex-direction: column;
    position: fixed; top: 0; bottom: 0; left: 0; width: var(--side-w);
    padding: 16px 10px; overflow-y: auto;
    background: var(--card);
    border-right: 0.5px solid var(--sep);
  }
  #sidebar .title { font-size: 20px; font-weight: 700; padding: 4px 10px 8px; }
  #sidebar h2 { font-size: 12px; font-weight: 400; color: var(--sub); margin: 14px 10px 4px; }
  #sidebar button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 7px 10px; border-radius: 8px; font-size: 15px; text-align: left;
  }
  #sidebar button:hover { background: var(--sep); }
  #sidebar .icon-open { margin-top: auto; padding: 7px 10px; font-size: 13px; }
  #sidebar button[aria-current="page"] { background: var(--active-bg); color: var(--accent); font-weight: 600; }
}
</style>
</head>
<body>

<nav id="sidebar" aria-label="ツール"></nav>

<dialog id="backup-dialog" aria-labelledby="backup-dialog-title">
  <header><h2 id="backup-dialog-title">バックアップ</h2><button class="done" type="button" data-backup-close>閉じる</button></header>
  <p class="note">全ツールの記録・設定・写真を1つのファイルにまとめます。読み込むと、ファイルの内容で各ツールのデータを置き換えます。</p>
  <div class="backup-actions">
    <button type="button" id="backup-export">ファイルに書き出す</button>
    <button type="button" id="backup-import">ファイルから復元</button>
    <input type="file" id="backup-file" accept=".json,application/json" hidden>
  </div>
  <p id="backup-status" role="status"></p>
</dialog>

<dialog id="icon-dialog" aria-labelledby="icon-dialog-title">
  <header><h2 id="icon-dialog-title">ホーム画面のアイコン</h2><button class="done" type="button" data-icon-close>完了</button></header>
  <p class="note">選んでから「ホーム画面に追加」すると、このアイコンになります。追加済みのアイコンは、一度削除して追加し直すと変わります。</p>
  <div class="icon-choices" id="icon-choices"></div>
</dialog>

<main id="stage">
</main>

<nav id="tabbar" aria-label="よく使うツール"></nav>
<div id="sheet-backdrop"></div>
<div id="sheet" role="dialog" aria-label="すべてのツール">
  <div class="grip"></div>
  <div id="sheet-list"></div>
  <p class="hint">ここでツールを長押しすると、下のバーに出す4つを入れ替えられます。</p>
  <button class="icon-open" type="button" data-backup-open>バックアップ</button>
  <button class="icon-open" type="button" data-icon-open>ホーム画面のアイコンを変える</button>
</div>

<script>
(function () {
  // ツール一覧。新しいツールを追加するときはここに1行足す
  var TOOLS = [
    { id: 'kiroku-calendar', name: 'きろくカレンダー', short: 'きろく', desc: '服薬・メモ・シフトと給与', group: '記録・管理', icon: 'kiroku-calendar/icons/icon-192.png', emoji: '📅' },
    { id: 'okozukai', name: 'お小遣い帳', short: 'お小遣い', desc: '財布ごとの入金・出金・振替', group: '記録・管理', icon: 'okozukai/icons/icon-192.png', emoji: '👛' },
    { id: 'meibo', name: '名簿', short: '名簿', desc: 'あだ名・タグ・色で人物を整理', group: '記録・管理', icon: 'meibo/icons/icon-192.png', emoji: '👥' },
    { id: 'sitememo', name: 'サイトメモ', short: 'メモ', desc: 'サイトとメモをタグで管理', group: '記録・管理', emoji: '🔖' },
    { id: 'teiki-oshirase', name: '配布タイマー', short: 'タイマー', desc: '配布の時刻をチャイムと通知で知らせる', group: '記録・管理', emoji: '⏰' },
    { id: 'otoku-checker', name: 'おとくチェック', short: 'おとく', desc: '単価を比べてどちらがお得か判定', group: '計算', icon: 'otoku-checker/icons/icon-192.png', emoji: '🛒' },
    { id: 'files', name: 'ファイル変換', short: 'ファイル', desc: 'PDF結合・画像サイズ拡大・PNG変換', group: 'ファイル', emoji: '🗂️' }
  ];
  // 以前のURL（#/pdf-merge など）で開いても、まとめたページの該当タブに移す
  var ALIAS = { 'pdf-merge': 'files/pdf', 'upscale-site': 'files/upscale', 'png': 'files/png' };
  var byId = {};
  TOOLS.forEach(function (t) { byId[t.id] = t; });

  // 下部バーに出すツール（端末ごとに記憶）
  var FAV_KEY = 'tools-hub:favorites';
  var LAST_KEY = 'tools-hub:last';
  var favorites = ['kiroku-calendar', 'okozukai', 'meibo', 'files'];
  try {
    var saved = JSON.parse(localStorage.getItem(FAV_KEY));
    if (Array.isArray(saved)) favorites = saved.filter(function (id) { return byId[id]; }).slice(0, 4);
  } catch (e) {}
  function saveFavorites() { try { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); } catch (e) {} }

  function iconHtml(t) {
    if (t.icon) return '<span class="icon"><img src="' + t.icon + '" alt="" data-emoji="' + t.emoji + '"></span>';
    return '<span class="icon">' + t.emoji + '</span>';
  }
  function groups() {
    var out = [];
    TOOLS.forEach(function (t) {
      var g = out.filter(function (x) { return x.name === t.group; })[0];
      if (!g) { g = { name: t.group, items: [] }; out.push(g); }
      g.items.push(t);
    });
    return out;
  }

  var stage = document.getElementById('stage');
  var frames = {}; // 一度開いたツールは iframe を残し、切り替えても状態を保つ

  function render() {
    // サイドバー
    var s = '<div class="title">ツール</div>';
    groups().forEach(function (g) {
      s += '<h2>' + g.name + '</h2>';
      g.items.forEach(function (t) { s += '<button data-go="' + t.id + '">' + iconHtml(t) + '<span>' + t.name + '</span></button>'; });
    });
    s += '<button class="icon-open" type="button" data-backup-open>バックアップ</button>';
    s += '<button class="icon-open" type="button" data-icon-open style="margin-top:0">ホーム画面のアイコン</button>';
    document.getElementById('sidebar').innerHTML = s;

    // 「すべて」シート
    var sh = '';
    groups().forEach(function (g) {
      sh += '<h2>' + g.name + '</h2><div class="grid">';
      g.items.forEach(function (t) { sh += '<button data-go="' + t.id + '" data-fav="' + t.id + '">' + iconHtml(t) + '<span>' + t.name + '</span></button>'; });
      sh += '</div>';
    });
    document.getElementById('sheet-list').innerHTML = sh;

    renderTabbar();
    fixIcons(document);
  }

  function renderTabbar() {
    var b = '';
    favorites.forEach(function (id) { var t = byId[id]; b += '<button data-go="' + id + '">' + iconHtml(t) + '<span>' + t.short + '</span></button>'; });
    b += '<button id="more-btn" data-more="1"><span class="icon">☰</span><span>すべて</span></button>';
    document.getElementById('tabbar').innerHTML = b;
    fixIcons(document.getElementById('tabbar'));
    markCurrent();
  }

  // 画像が読めないときは絵文字に差し替える
  function fixIcons(root) {
    Array.prototype.forEach.call(root.querySelectorAll('img[data-emoji]'), function (img) {
      img.addEventListener('error', function () { img.parentNode.textContent = img.dataset.emoji; }, { once: true });
    });
  }

  function route() { return location.hash.replace(/^#\/?/, ''); }
  function current() { return route().split('/')[0]; }
  function sub() { return route().split('/').slice(1).join('/'); }
  var mq = window.matchMedia('(max-width: 767px)');
  function tellMode(f) {
    try { f.contentWindow.postMessage({ type: 'hub:mode', mobile: mq.matches }, location.origin); } catch (e) {}
  }
  function updateOwnBar() {
    var id = current();
    document.body.classList.toggle('own-bar', !!(frames[id] && frames[id].dataset.ownBar));
  }

  function show() {
    if (ALIAS[current()]) { location.replace('#/' + ALIAS[current()]); return; }
    var id = current();
    if (!byId[id]) {
      // ホーム画面は置かず、前回開いていたツールを開く
      var last = '';
      try { last = localStorage.getItem(LAST_KEY) || ''; } catch (e) {}
      location.replace('#/' + (byId[last] ? last : favorites[0] || TOOLS[0].id));
      return;
    }
    try { localStorage.setItem(LAST_KEY, id); } catch (e) {}
    Object.keys(frames).forEach(function (k) { frames[k].hidden = k !== id; });
    if (id && !frames[id]) {
      var f = document.createElement('iframe');
      f.src = id + '/' + (sub() ? '#' + sub() : '');
      f.title = byId[id].name;
      f.addEventListener('load', function () { tellMode(f); });
      f.setAttribute('allow', 'clipboard-read; clipboard-write; fullscreen');
      stage.appendChild(f);
      frames[id] = f;
    }
    else if (id && sub()) {
      try { frames[id].contentWindow.location.hash = sub(); } catch (e) {}
    }
    document.title = id ? byId[id].name + ' - ツール' : 'ツール';
    updateOwnBar();
    markCurrent();
  }

  function markCurrent() {
    var id = current();
    Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function (el) {
      if (el.dataset.go === id) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
    });
    var more = document.getElementById('more-btn');
    if (more) {
      var inBar = favorites.indexOf(id) !== -1;
      if (inBar) more.removeAttribute('aria-current'); else more.setAttribute('aria-current', 'page');
    }
  }

  function closeSheet() { document.body.classList.remove('sheet-open'); }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-go],[data-more]');
    if (!el) return;
    if (el.dataset.more) { document.body.classList.toggle('sheet-open'); return; }
    if (longPressed) { longPressed = false; return; }
    var target = '#/' + el.dataset.go;
    if (location.hash !== target) location.hash = target; else show();
    closeSheet();
  });
  document.getElementById('sheet-backdrop').addEventListener('click', closeSheet);

  // シート内で長押し → 下部バーに追加/入れ替え
  var pressTimer = null, longPressed = false;
  document.getElementById('sheet').addEventListener('pointerdown', function (e) {
    var el = e.target.closest('[data-fav]');
    if (!el) return;
    longPressed = false;
    pressTimer = setTimeout(function () {
      longPressed = true;
      var id = el.dataset.fav;
      var i = favorites.indexOf(id);
      if (i !== -1) favorites.splice(i, 1);
      else { favorites.unshift(id); favorites = favorites.slice(0, 4); }
      saveFavorites();
      renderTabbar();
      if (navigator.vibrate) navigator.vibrate(15);
      el.animate && el.animate([{ transform: 'scale(0.9)' }, { transform: 'scale(1)' }], 200);
    }, 550);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) {
    document.getElementById('sheet').addEventListener(ev, function () { clearTimeout(pressTimer); });
  });
  document.getElementById('sheet').addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ツール側からの連絡（自前の下部タブバーがある／メニューを開きたい）
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data) return;
    var from = Object.keys(frames).filter(function (k) { return frames[k].contentWindow === e.source; })[0];
    if (e.data.type === 'hub:own-bar' && from) {
      frames[from].dataset.ownBar = '1';
      tellMode(frames[from]);
      updateOwnBar();
    }
    if (e.data.type === 'hub:open-menu') document.body.classList.add('sheet-open');
  });
  mq.addEventListener('change', function () { Object.keys(frames).forEach(function (k) { tellMode(frames[k]); }); });

  // ---- ホーム画面アイコン ----
  var ICONS = [
    { id: 'grid-blue', label: '青' }, { id: 'grid-black', label: '黒' }, { id: 'grid-white', label: '白' },
    { id: 'grid-green', label: '緑' }, { id: 'dots-orange', label: 'オレンジ' }, { id: 'stack-indigo', label: '紫' },
    { id: 'kiroku', label: 'きろくカレンダー', src: 'kiroku-calendar/icons/apple-touch-icon.png', big: 'kiroku-calendar/icons/icon-512.png' },
    { id: 'okozukai', label: 'お小遣い帳', src: 'okozukai/icons/apple-touch-icon.png', big: 'okozukai/icons/icon-512.png' },
    { id: 'meibo', label: '名簿', src: 'meibo/icons/apple-touch-icon.png', big: 'meibo/icons/icon-512.png' },
    { id: 'otoku', label: 'おとくチェック', src: 'otoku-checker/icons/icon-180.png', big: 'otoku-checker/icons/icon-512.png' }
  ];
  function iconSrc(ic, big) {
    if (ic.src) return big ? ic.big : ic.src;
    return 'icons/' + ic.id + (big ? '-512.png' : '-180.png');
  }
  var manifestUrl = null;
  function applyIcon(id) {
    var ic = ICONS.filter(function (x) { return x.id === id; })[0] || ICONS[0];
    document.getElementById('touch-icon').href = iconSrc(ic);
    document.getElementById('fav-icon').href = iconSrc(ic);
    // Android 用：選んだアイコン入りのマニフェストをその場で作る
    var base = location.href.replace(/[#?].*$/, '').replace(/[^/]*$/, '');
    var manifest = {
      name: 'ツール', short_name: 'ツール', start_url: base, scope: base, display: 'standalone',
      background_color: '#F2F2F7', theme_color: '#F2F2F7',
      icons: [
        { src: base + iconSrc(ic), sizes: '180x180', type: 'image/png' },
        { src: base + iconSrc(ic, true), sizes: '512x512', type: 'image/png' }
      ]
    };
    if (manifestUrl) URL.revokeObjectURL(manifestUrl);
    manifestUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    document.getElementById('manifest-link').href = manifestUrl;
    Array.prototype.forEach.call(document.querySelectorAll('#icon-choices button'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.icon === ic.id ? 'true' : 'false');
    });
  }
  document.getElementById('icon-choices').innerHTML = ICONS.map(function (ic) {
    return '<button type="button" data-icon="' + ic.id + '" aria-label="' + ic.label + '"><img src="' + iconSrc(ic) + '" alt=""></button>';
  }).join('');
  document.getElementById('icon-choices').addEventListener('click', function (e) {
    var b = e.target.closest('[data-icon]');
    if (!b) return;
    try { localStorage.setItem('tools-hub:icon', b.dataset.icon); } catch (err) {}
    applyIcon(b.dataset.icon);
  });
  var dlg = document.getElementById('icon-dialog');
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-icon-open]')) { closeSheet(); dlg.showModal(); }
    if (e.target.closest('[data-icon-close]')) dlg.close();
  });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  applyIcon(window.__hubIcon);

  // ---- まとめてバックアップ ----
  var bdlg = document.getElementById('backup-dialog');
  var bstatus = document.getElementById('backup-status');
  var bExport = document.getElementById('backup-export');
  var bImport = document.getElementById('backup-import');
  var bFile = document.getElementById('backup-file');
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-backup-open]')) { closeSheet(); bstatus.textContent = ''; bdlg.showModal(); }
    if (e.target.closest('[data-backup-close]')) bdlg.close();
  });
  bdlg.addEventListener('click', function (e) { if (e.target === bdlg) bdlg.close(); });
  function busy(on) { bExport.disabled = on; bImport.disabled = on; }

  bExport.addEventListener('click', async function () {
    busy(true);
    bstatus.textContent = '書き出しています…';
    try {
      var data = await window.ToolsBackup.exportAll();
      var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      var d = new Date();
      var name = 'tools-backup-' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.json';
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 10000);
      bstatus.textContent = name + '（' + (blob.size / 1024 / 1024).toFixed(1) + 'MB）を保存しました。';
    } catch (err) {
      bstatus.textContent = '書き出せませんでした：' + (err && err.message || err);
    }
    busy(false);
  });

  bImport.addEventListener('click', function () { bFile.value = ''; bFile.click(); });
  bFile.addEventListener('change', async function () {
    var f = bFile.files && bFile.files[0];
    if (!f) return;
    if (!confirm('「' + f.name + '」の内容で、全ツールのデータを置き換えます。今のデータは消えます。よろしいですか？')) return;
    busy(true);
    bstatus.textContent = '復元しています…';
    try {
      var data = JSON.parse(await f.text());
      // 各ツールがデータベースを開いたままだと消せないので、先に閉じる
      Object.keys(frames).forEach(function (k) { frames[k].remove(); delete frames[k]; });
      await window.ToolsBackup.importAll(data);
      bstatus.textContent = '復元しました。読み込み直します…';
      setTimeout(function () { location.reload(); }, 800);
    } catch (err) {
      bstatus.textContent = '復元できませんでした：' + (err && err.message || err);
      busy(false);
      show();
    }
  });

  window.addEventListener('hashchange', show);
  render();
  show();
})();
</script>
</body>
</html>
