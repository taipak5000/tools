<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像一括PNG変換＆ZIPツール</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.5rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #3498db;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>画像一括PNG変換＆ZIPツール</h1>
    
    <div class="form-group">
        <label for="imageInput">画像をアップロード（複数選択可）</label>
        <input type="file" id="imageInput" accept="image/*" multiple>
    </div>

    <div class="form-group">
        <label for="prefixInput">ファイル名のプレフィックス（接頭辞）</label>
        <input type="text" id="prefixInput" value="cape" placeholder="例: cape">
        <small style="color: #666; display: block; margin-top: 5px;">※ 出力は「入力した文字_001.png」のようになります。</small>
    </div>

    <button id="processBtn">変換してZIPをダウンロード</button>
    <div id="status"></div>
</div>

<script>
    document.getElementById('processBtn').addEventListener('click', async () => {
        const fileInput = document.getElementById('imageInput');
        const prefixInput = document.getElementById('prefixInput').value.trim() || 'image';
        const statusDiv = document.getElementById('status');
        const processBtn = document.getElementById('processBtn');

        if (fileInput.files.length === 0) {
            alert('画像ファイルを選択してください。');
            return;
        }

        // UIを処理中状態にする
        processBtn.disabled = true;
        statusDiv.textContent = '処理中...';
        statusDiv.style.color = '#e67e22';

        const zip = new JSZip();
        let fileIndex = 1;

        // 非同期で全ての画像を処理するPromiseの配列を作成
        const promises = Array.from(fileInput.files).map(file => {
            return new Promise((resolve, reject) => {
                // 画像ファイル以外はスキップ
                if (!file.type.startsWith('image/')) {
                    resolve();
                    return;
                }

                const img = new Image();
                const url = URL.createObjectURL(file);

                img.onload = () => {
                    // Canvasを作成して画像を描画
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    // CanvasをPNG形式のBlobに変換
                    canvas.toBlob(blob => {
                        if (blob) {
                            // 001, 002 のようにゼロパディング
                            const paddedIndex = String(fileIndex).padStart(3, '0');
                            const fileName = `${prefixInput}_${paddedIndex}.png`;
                            zip.file(fileName, blob);
                            fileIndex++;
                        }
                        URL.revokeObjectURL(url);
                        resolve();
                    }, 'image/png');
                };

                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error(`${file.name}の読み込みに失敗しました`));
                };

                img.src = url;
            });
        });

        try {
            // 全ての画像処理が完了するまで待機
            await Promise.all(promises);

            if (fileIndex === 1) {
                throw new Error('有効な画像ファイルがありませんでした。');
            }

            statusDiv.textContent = 'ZIPファイルを作成中...';

            // ZIPファイルを生成
            const zipBlob = await zip.generateAsync({ type: 'blob' });
            
            // ダウンロードトリガーを作成
            const downloadUrl = URL.createObjectURL(zipBlob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `${prefixInput}_images.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);

            statusDiv.textContent = '完了しました！';
            statusDiv.style.color = '#27ae60';
        } catch (error) {
            console.error(error);
            statusDiv.textContent = 'エラーが発生しました: ' + error.message;
            statusDiv.style.color = '#c0392b';
        } finally {
            processBtn.disabled = false;
        }
    });
</script>

</body>
</html>
