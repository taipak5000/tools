<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像PNG変換＆ZIP作成</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{
    font-family: sans-serif;
    background:#f5f5f5;
    padding:30px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h1{
    margin-top:0;
}

input[type=text]{
    width:200px;
    padding:8px;
}

button{
    padding:12px 25px;
    font-size:16px;
    cursor:pointer;
    border:none;
    border-radius:8px;
    background:#2196F3;
    color:white;
}

button:hover{
    background:#1976D2;
}

#status{
    margin-top:20px;
    white-space:pre-line;
}
</style>

</head>
<body>

<div class="container">

<h1>画像 → PNG変換</h1>

<p>
プレフィックス：
<input id="prefix" value="cape">
</p>

<p>
<input type="file" id="files" multiple accept="image/*">
</p>

<button id="start">
PNGへ変換してZIPダウンロード
</button>

<div id="status"></div>

</div>

<script>

const fileInput=document.getElementById("files");
const status=document.getElementById("status");

document.getElementById("start").onclick=async()=>{

    const files=fileInput.files;

    if(files.length===0){
        alert("画像を選択してください");
        return;
    }

    const prefix=document.getElementById("prefix").value.trim() || "image";

    const zip=new JSZip();

    status.textContent="変換中...";

    for(let i=0;i<files.length;i++){

        status.textContent=
        `変換中 ${i+1}/${files.length}`;

        const file=files[i];

        const img=new Image();

        const url=URL.createObjectURL(file);

        await new Promise(resolve=>{

            img.onload=()=>{

                const canvas=document.createElement("canvas");

                canvas.width=img.width;
                canvas.height=img.height;

                const ctx=canvas.getContext("2d");

                ctx.drawImage(img,0,0);

                canvas.toBlob(blob=>{

                    const number=String(i+1).padStart(3,"0");

                    zip.file(
                        `${prefix}_${number}.png`,
                        blob
                    );

                    URL.revokeObjectURL(url);

                    resolve();

                },"image/png");

            };

            img.src=url;

        });

    }

    status.textContent="ZIP作成中...";

    const content=await zip.generateAsync({
        type:"blob"
    });

    const a=document.createElement("a");

    a.href=URL.createObjectURL(content);

    a.download=`${prefix}_png.zip`;

    a.click();

    URL.revokeObjectURL(a.href);

    status.textContent=
    `完了！
${files.length}枚を変換しました。`;

};

</script>

</body>
</html>
